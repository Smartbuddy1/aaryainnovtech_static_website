<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Aarya Innovtech</title>
    <link rel="icon" href="assets/images/favicon.png" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <a class="login-brand" href="index.html" aria-label="Aarya Innovtech home">
        <img src="assets/images/logo.png" alt="Aarya Innovtech Pvt. Ltd." />
      </a>
      <form class="login-card" data-form="login">
        <h1>Login</h1>
        <p>Welcome back! Please login to your account.</p>
        <label>
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <div class="login-row">
          <label class="check-label">
            <input type="checkbox" name="remember" />
            <span>Remember Me</span>
          </label>
          <a href="contact.html">Forgot Password?</a>
        </div>
        <button class="btn primary wide" type="submit">Login</button>
        <p class="form-note" aria-live="polite"></p>
        <p class="login-help">Don&apos;t have an account? <a href="contact.html">Contact Admin</a></p>
      </form>
    </main>

    <script src="assets/js/main.js"></script>
  </body>
</html>
